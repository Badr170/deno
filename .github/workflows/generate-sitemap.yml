name: Generate Sitemap

on:
  push:
    branches: [main]
    paths:
      - 'Packages'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap.xml from Packages
        shell: bash
        run: |
          python3 <<'PY'
          from html import escape
          from pathlib import Path
          import re
          from datetime import date

          BASE = 'https://badr170.github.io/deno/'
          packages = Path('Packages').read_text(encoding='utf-8', errors='replace')
          ids = re.findall(r'^Package:\s*(\S+)\s*$', packages, flags=re.MULTILINE)

          # Keep order, remove duplicates.
          ids = list(dict.fromkeys(ids))

          urls = [BASE]
          urls += [BASE + 'package.html?id=' + escape(pkg, quote=True) for pkg in ids]

          today = date.today().isoformat()
          body = ['<?xml version="1.0" encoding="UTF-8"?>',
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url in urls:
              body += ['  <url>', f'    <loc>{url}</loc>', f'    <lastmod>{today}</lastmod>', '  </url>']
          body.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(body) + '\n', encoding='utf-8')
          print(f'Generated sitemap.xml with {len(urls)} URLs ({len(ids)} packages).')
          PY

      - name: Commit sitemap if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo 'Sitemap is already up to date.'
            exit 0
          fi
          git commit -m 'تحديث Sitemap تلقائيًا للحزم'
          git push
